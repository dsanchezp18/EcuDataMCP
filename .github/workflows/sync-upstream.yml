name: Sync upstream

# Keeps this fork's main in step with DweskZ/EcuDataMCP so Render redeploys
# the latest upstream code. Merges (not a hard reset), so fork-only commits
# such as this workflow survive.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Never runs on the upstream repo itself.
    if: github.repository != 'DweskZ/EcuDataMCP'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          # GITHUB_TOKEN cannot push changes to .github/workflows/*. If an
          # upstream sync touches workflow files, add a personal access token
          # with the "workflow" scope as the SYNC_TOKEN repository secret.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main
