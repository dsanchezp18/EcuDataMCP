name: Sync upstream

# Merges DweskZ/EcuDataMCP main into this fork's main so the Oracle instance
# deploys the latest upstream code. Merges (not a hard reset), so fork-only
# commits such as this workflow survive.
#
# Manual only: run it from the Actions tab ("Run workflow"). The built-in
# GITHUB_TOKEN may not change files under .github/workflows/, so this run
# fails whenever upstream has edited a workflow. In that case sync from your
# own machine instead, where your gh login has the "workflow" scope:
#   gh repo sync dsanchezp18/EcuDataMCP --branch main
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Never runs on the upstream repo itself.
    if: github.repository != 'DweskZ/EcuDataMCP'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$REPO/merge-upstream" -f branch=main
